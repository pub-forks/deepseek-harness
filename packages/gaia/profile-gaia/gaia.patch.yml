# GAIA: overlay for the shipped web profile; row config replacement is complete.
- id: webserver
  config:
    host: 127.0.0.1
    port: !!js ctx.webStartup.port ?? 0
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
- id: web-runtime
  config:
    openBrowser: false
    printUrl: true
    # GAIA: off. The web-surface section is DSH-developer orientation (HMR,
    # `pnpm run dev:web`) and embeds the loopback URL, whose `--port 0` port
    # changes on every runtime restart and breaks the prompt-cache prefix of
    # resumed sessions; Gaia users reach the GUI only through Gaia's proxy.
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts
# GAIA: no llm-pi-ai row here. An overlay outranks the profile layer that
# Settings → Models writes, which made every provider read-only. The bridge
# seeds the openai-codex route into the user's profile once instead.
- id: hmr
  disabled: true
- id: client-hmr
  disabled: true
- id: session-telemetry-otel
  disabled: true
# GAIA: no feedback surface. ui-message-feedback owns Like/Dislike under
# replies, the feedback dialog and the Session menu's Feedback entry (that
# entry appears only while its feedbackUi service exists); message-feedback
# and command-feedback are its host Remotes and the /feedback command.
- id: ui-message-feedback
  disabled: true
- id: message-feedback
  disabled: true
- id: command-feedback
  disabled: true
- insert:
    # GAIA: the bridge also mounts Host workspace model memory for new sessions.
    - id: gaia-bridge
      name: '@deepseek-ai/dsh-gaia-bridge'
    # GAIA: Remote runs behind the regular browser-cookie API Gateway.
    - id: gaia-api-authorization
      name: '@deepseek-ai/dsh-gaia-api-authorization'
    # GAIA: browser bundle contributes the generic Sign-in Settings section.
    - id: gaia-ui-authorization
      name: '@deepseek-ai/dsh-gaia-ui-authorization'
    # GAIA: browser bundle contributes the single-session drawer embed mode.
    - id: gaia-ui-embed
      name: '@deepseek-ai/dsh-gaia-ui-embed'
    # GAIA: Markdown document renderer overrides DSH's builtin preview.
    - id: gaia-ui-markdown
      name: '@deepseek-ai/dsh-gaia-ui-markdown'
